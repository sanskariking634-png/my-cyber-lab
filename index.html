<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF Tournament Zone</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background-color: #0f172a; color: #fff; padding: 15px; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: #1e293b; border-radius: 12px; margin-bottom: 20px; }
        .logo { font-size: 18px; font-weight: bold; color: #ff4655; }
        .wallet-box { background: #0f172a; padding: 8px 15px; border-radius: 20px; font-weight: bold; color: #4ade80; border: 1px solid #22c55e; }
        .action-btns { display: flex; gap: 10px; margin-bottom: 25px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; }
        .btn-deposit { background: #22c55e; color: #fff; }
        .btn-withdraw { background: #eab308; color: #000; }
        .section-title { font-size: 18px; margin-bottom: 15px; border-left: 4px solid #ff4655; padding-left: 10px; }
        .match-card { background: #1e293b; border-radius: 12px; overflow: hidden; margin-bottom: 20px; border: 1px solid #334155; }
        .match-header { background: #ff4655; color: white; padding: 8px 15px; font-weight: bold; }
        .match-body { padding: 15px; }
        .match-details { display: grid; grid-template-columns: 1fr 1fr 1fr; text-align: center; margin: 15px 0; background: #0f172a; padding: 10px; border-radius: 8px; }
        .btn-join { width: 100%; background: #ff4655; color: white; padding: 12px; font-size: 16px; border-radius: 8px; border: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">🔥 FF ZONE</div>
        <div class="wallet-box">💰 ₹<span id="balance">0</span></div>
    </div>
    <div class="action-btns">
        <button class="btn btn-deposit" onclick="addMoney()">+ Add Money</button>
        <button class="btn btn-withdraw" onclick="withdrawMoney()">⮯ Withdraw</button>
    </div>
    <div class="section-title">Upcoming Matches</div>
    <div class="match-card">
        <div class="match-header">SOLO - BERMUDA MAP #MATCH-01</div>
        <div class="match-body">
            <div class="match-details">
                <div><span>WIN PRIZE</span><br><strong>₹200</strong></div>
                <div><span>PER KILL</span><br><strong>₹10</strong></div>
                <div><span>ENTRY</span><br><strong>₹30</strong></div>
            </div>
            <button class="btn-join" onclick="joinMatch('SOLO #MATCH-01')">JOIN NOW</button>
        </div>
    </div>
    <script>
        function addMoney() { alert("Payment QR Code par ₹ pay karein."); }
        function withdrawMoney() { alert("Withdrawal request submit ho gayi hai!"); }
        function joinMatch(m) { prompt(m + " ke liye Free Fire Name daalein:"); }
    </script>
</body>
</html>
