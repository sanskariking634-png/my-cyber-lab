<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF Tournament Zone</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #171d26; color: #ffffff; padding: 12px; font-size: 13px; }

        /* Header */
        .top-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .brand-block { display: flex; align-items: center; gap: 10px; }
        .avatar-img { width: 38px; height: 38px; background: #ff5722; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; border: 2px solid #ff7043; font-weight: bold; }
        .brand-meta div:first-child { font-size: 10px; color: #90a4ae; }
        .brand-meta div:last-child { font-size: 15px; font-weight: bold; color: #ffffff; text-transform: uppercase; }

        .coin-btn { background: #ffffff; color: #171d26; padding: 5px 14px; border-radius: 20px; font-weight: bold; font-size: 13px; display: flex; align-items: center; gap: 6px; cursor: pointer; }
        .coin-icon { background: #ff5722; color: #fff; width: 18px; height: 18px; border-radius: 50%; font-size: 11px; display: flex; align-items: center; justify-content: center; font-weight: bold; }

        /* Notice Bar */
        .announcement { background: #ffffff; color: #171d26; padding: 8px 12px; border-radius: 8px; font-weight: bold; font-size: 11px; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        .announcement-icon { background: #ff5722; color: white; padding: 4px; border-radius: 4px; font-size: 12px; }

        /* Titles */
        .sub-title { font-size: 13px; font-weight: bold; color: #eceff1; margin: 12px 0 8px 0; }

        /* Quick Grid */
        .quick-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; text-align: center; margin-bottom: 15px; }
        .quick-item { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; color: #b0bec5; cursor: pointer; }
        .quick-circle { width: 44px; height: 44px; background: #ff5722; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #fff; }

        /* My Contest */
        .contest-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 15px; }
        .contest-box { background: #ffffff; color: #1a222d; padding: 8px 2px; text-align: center; border-radius: 6px; font-size: 11px; font-weight: bold; }
        .contest-box span { display: block; font-size: 14px; margin-bottom: 2px; }

        /* Games Grid with Real Free Fire Images */
        .games-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 20px; }
        .game-item { background: #ff5722; border-radius: 8px; overflow: hidden; text-align: center; border: 1px solid #37474f; }
        .game-item img { width: 100%; height: 75px; object-fit: cover; display: block; }
        .game-name { padding: 5px; font-size: 10px; font-weight: bold; color: #fff; text-transform: uppercase; }

        /* Match Card */
        .match-container { background: #ffffff; color: #1a222d; border-radius: 10px; overflow: hidden; margin-bottom: 15px; }
        .match-header-tag { background: #1a222d; color: #fff; padding: 8px 12px; font-size: 12px; font-weight: bold; }
        .match-body-content { padding: 12px; }
        .match-schedule { font-size: 11px; color: #78909c; margin-bottom: 10px; }

        .stats-row { display: flex; justify-content: space-between; margin-bottom: 10px; text-align: center; }
        .stat-box span { font-size: 9px; color: #78909c; display: block; text-transform: uppercase; }
        .stat-box strong { font-size: 13px; color: #1a222d; }

        .spot-bar { background: #cfd8dc; height: 6px; border-radius: 10px; overflow: hidden; margin-bottom: 4px; }
